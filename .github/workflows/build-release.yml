- name: Install Android SDK command-line tools
  run: |
    sudo apt-get update
    sudo apt-get install -y wget unzip
    export ANDROID_SDK_ROOT=$HOME/android-sdk
    mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    cd $ANDROID_SDK_ROOT/cmdline-tools
    # adjust URL/version if you have a preferred command-line tools version
    wget -q https://dl.google.com/android/repository/commandlinetools-linux-10125405_latest.zip -O cmdline.zip
    unzip -q cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools/latest
    rm cmdline.zip
    export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    yes | sdkmanager --licenses
    sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
  env:
    ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
