name: Build Release APK & AAB

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-release:
    name: Build Android APK and AAB Release
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle --version

      - name: Check project structure
        run: |
          echo "Root:"
          ls -la

          echo "App:"
          ls -la app || true

          echo "Gradle:"
          ls -la gradle || true

      - name: Build Release APK and AAB
        run: |
          gradle clean :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify APK output
        run: |
          echo "APK files:"
          ls -la app/build/outputs/apk/release || true

          echo "AAB files:"
          ls -la app/build/outputs/bundle/release || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Android Release v1.0.0
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
